name: Deploy Album Sorter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the catalog API is configured
        env:
          VITE_CATALOG_API_BASE_URL: ${{ vars.VITE_CATALOG_API_BASE_URL }}
        run: |
          if [ -z "$VITE_CATALOG_API_BASE_URL" ]; then
            echo "Configure the VITE_CATALOG_API_BASE_URL repository variable before deploying."
            exit 1
          fi

      - name: Build website with the Cloudflare API URL
        env:
          VITE_CATALOG_API_BASE_URL: ${{ vars.VITE_CATALOG_API_BASE_URL }}
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4