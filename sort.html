<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Sorter: Rank Your Top 10 Albums!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Album Sorter: type in 10 album titles to get started!</h1>
    <!-- search text field -->
    <form id="albumForm">
        <input type="text" id="albumTitle" placeholder="Enter an album title" required>
        <!-- buttons to search for an album and to refresh page -->
        <button type="button" onclick="addAlbum()">Add Album</button>
        <button type="button" onclick="refresh()">New Sorting</button>
    </form>
    <div id="results"></div>
        <!-- table display of album cover, rank, title, and artist -->
        <table id="albumsTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Album Cover</th>
                    <th>Title</th>
                    <th>Artist</th>
                </tr>
            </thead>
            <!-- table body generated by JavaScript -->
            <tbody>
                <!-- Album Rankings -->
            </tbody>
        </table>
    <script src="script.js"></script>
</body>

</html>
